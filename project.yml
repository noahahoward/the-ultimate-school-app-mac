name: Locker
options:
  bundleIdPrefix: com.locker
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.20.3"
    CURRENT_PROJECT_VERSION: "47"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES

targets:
  Locker:
    type: application
    platform: macOS
    sources:
      - path: Locker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.locker.Locker
        PRODUCT_NAME: Locker
        INFOPLIST_FILE: Locker/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: Locker
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  LockerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LockerTests
    dependencies:
      - target: Locker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.locker.LockerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Locker.app/Contents/MacOS/Locker"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Locker:
    build:
      targets:
        Locker: all
        LockerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LockerTests
